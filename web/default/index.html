<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>TUFTech</title>
    <meta name="title" content="TUFTech" />
    <meta
      name="description"
      content="TUFTech — 一个 Base URL，接入你的生产级 AI 工作流。统一模型接口、分组隔离、价格透明、日志追踪。"
    />

    <meta name="theme-color" content="#fff" />

    <!-- TUFTech branded boot splash: shown on first paint before the app
         bundle mounts, then automatically replaced when React renders #root. -->
    <style>
      #tuftech-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #ffffff;
        /* Only reveal the splash if loading actually takes a moment; a cached
           instant mount removes #root's children before this fade-in starts,
           so fast loads never flash the splash. */
        opacity: 0;
        animation: ts-fadein 0.3s ease-out 0.15s both;
      }
      @keyframes ts-fadein {
        to {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        #tuftech-splash {
          background: #1c1c1c;
        }
        #tuftech-splash .ts-name {
          color: #fafafa;
        }
      }
      #tuftech-splash .ts-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        object-fit: contain;
        animation: ts-pulse 1.6s ease-in-out infinite;
      }
      #tuftech-splash .ts-name {
        font-family:
          'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #18181b;
      }
      #tuftech-splash .ts-ring {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(37, 99, 235, 0.16);
        border-top-color: #2563eb;
        animation: ts-spin 0.8s linear infinite;
      }
      @keyframes ts-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ts-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tuftech-splash {
          animation: none;
          opacity: 1;
        }
        #tuftech-splash .ts-logo,
        #tuftech-splash .ts-ring {
          animation: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root"></div>
    <!-- Sibling of #root (not a child), so main.tsx's `!rootElement.innerHTML`
         mount guard still passes. Removed by main.tsx once React paints. -->
    <div id="tuftech-splash">
      <img src="/logo.png" alt="TUFTech" class="ts-logo" />
      <div class="ts-name">TUFTech</div>
      <div class="ts-ring"></div>
    </div>
  </body>
</html>
