<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TUFTech</title>
    <meta name="title" content="TUFTech" />
    <meta
      name="description"
      content="TUFTech — 一个 Base URL，接入你的生产级 AI 工作流。统一模型接口、分组隔离、价格透明、日志追踪。"
    />

    <meta name="theme-color" content="#fff" />
    <style>
      #tuftech-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #fff;
        opacity: 0;
        animation: ts-fadein 0.3s ease-out 0.15s both;
      }
      #tuftech-splash .ts-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        object-fit: contain;
        animation: ts-pulse 1.6s ease-in-out infinite;
      }
      #tuftech-splash .ts-name {
        color: #18181b;
        font-family:
          'Public Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #tuftech-splash .ts-ring {
        width: 38px;
        height: 38px;
        border: 3px solid rgb(37 99 235 / 16%);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: ts-spin 0.8s linear infinite;
      }
      @keyframes ts-fadein {
        to {
          opacity: 1;
        }
      }
      @keyframes ts-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ts-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.94);
        }
      }
      @media (prefers-color-scheme: dark) {
        #tuftech-splash {
          background: #1c1c1c;
        }
        #tuftech-splash .ts-name {
          color: #fafafa;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tuftech-splash {
          opacity: 1;
          animation: none;
        }
        #tuftech-splash .ts-logo,
        #tuftech-splash .ts-ring {
          animation: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <div id="tuftech-splash" aria-hidden="true">
      <img src="/logo.png" alt="TUFTech" class="ts-logo" />
      <div class="ts-name">TUFTech</div>
      <div class="ts-ring"></div>
    </div>
  </body>
</html>
